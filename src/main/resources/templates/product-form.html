<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.productId != null ? 'Edit Product' : 'Add New Product'}">Product Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2em;
        }
        
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .required::after {
            content: " *";
            color: red;
        }
        
        .help-text {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${product.productId != null ? '✏️ Edit Product' : '➕ Add New Product'}">Product Form</h1>
        </div>
        
        <div class="form-container">
            <form th:action="${product.productId != null ? '/products/update/' + product.productId : '/products/save'}" 
                  th:object="${product}" 
                  method="post">
                
                <div class="form-group">
                    <label for="productName" class="required">Product Name</label>
                    <input type="text" id="productName" th:field="*{productName}" required placeholder="Enter product name">
                </div>
                
                <div class="form-group">
                    <label for="sku">SKU</label>
                    <input type="text" id="sku" th:field="*{sku}" placeholder="Auto-generated if left empty">
                    <div class="help-text">Stock Keeping Unit - Leave empty to auto-generate</div>
                </div>
                
                <div class="form-group">
                    <label for="category" class="required">Category</label>
                    <select id="category" th:field="*{category}" required>
                        <option value="">-- Select Category --</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Food">Food</option>
                        <option value="Books">Books</option>
                        <option value="Home & Garden">Home & Garden</option>
                        <option value="Sports">Sports</option>
                        <option value="Toys">Toys</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="price" class="required">Price ($)</label>
                    <input type="number" id="price" th:field="*{price}" step="0.01" min="0" required placeholder="0.00">
                    <div class="help-text">Enter the unit price for this product</div>
                </div>
                
                <div class="form-group">
                    <label for="stockQuantity" class="required">Stock Quantity</label>
                    <input type="number" id="stockQuantity" th:field="*{stockQuantity}" min="0" required placeholder="0">
                    <div class="help-text">Current available stock count</div>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" placeholder="Enter product description (optional)"></textarea>
                </div>
                
                <div class="form-actions">
                    <a href="/products" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" th:text="${product.productId != null ? 'Update Product' : 'Add Product'}">Save Product</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

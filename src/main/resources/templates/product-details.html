<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - OLTP Sales System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 2em;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .product-header {
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .product-name {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .product-category {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .detail-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .detail-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .detail-value {
            font-size: 1.5em;
            color: #333;
            font-weight: bold;
        }
        
        .description-section {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .description-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .description-section p {
            color: #666;
            line-height: 1.6;
            font-size: 1.1em;
        }
        
        .stock-status {
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            display: inline-block;
        }
        
        .stock-high {
            background: #d4edda;
            color: #155724;
        }
        
        .stock-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .stock-low {
            background: #f8d7da;
            color: #721c24;
        }
        
        .actions-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #eee;
            text-align: center;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/modern-ui.css}" href="/css/modern-ui.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Product Details</h1>
            <div>
                <a href="/products" class="btn btn-secondary">← Back to Products</a>
            </div>
        </div>
        
        <div class="content">
            <div class="product-header">
                <h2 class="product-name" th:text="${product.productName}">Product Name</h2>
                <span class="product-category" th:text="${product.category}">Category</span>
            </div>
            
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Product ID</div>
                    <div class="detail-value" th:text="${product.productId}">1</div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-label">Price (LKR)</div>
                    <div class="detail-value" th:text="'LKR ' + ${#numbers.formatDecimal(product.price, 1, 2)}">LKR 99.99</div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-label">Stock Quantity</div>
                    <div class="detail-value" th:text="${product.stockQuantity}">100</div>
                </div>
                
                <div class="detail-item">
                    <div class="detail-label">Stock Status</div>
                    <div class="detail-value">
                        <span th:if="${product.stockQuantity > 50}" class="stock-status stock-high">✓ In Stock</span>
                        <span th:if="${product.stockQuantity <= 50 && product.stockQuantity > 10}" class="stock-status stock-medium">⚠ Low Stock</span>
                        <span th:if="${product.stockQuantity <= 10}" class="stock-status stock-low">✗ Critical</span>
                    </div>
                </div>
            </div>
            
            <div class="description-section" th:if="${product.description != null && !product.description.isEmpty()}">
                <h3>📝 Description</h3>
                <p th:text="${product.description}">Product description goes here...</p>
            </div>
            
            <div class="description-section" th:if="${product.description == null || product.description.isEmpty()}">
                <h3>📝 Description</h3>
                <p style="font-style: italic; color: #999;">No description available for this product.</p>
            </div>
            
            <div class="actions-section">
                <a th:href="@{/products/edit/{id}(id=${product.productId})}" class="btn btn-success">✏️ Edit Product</a>
                <form th:action="@{/products/delete/{id}(id=${product.productId})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this product?')">🗑️ Delete Product</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
